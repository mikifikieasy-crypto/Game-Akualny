name: Publikuj GameStats

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Rozpakuj GameStats
        run: |
          mkdir -p _site
          unzip -o GameStats-GitHub-Paczka.zip -d _site

      - name: Przygotuj stronę
        uses: actions/configure-pages@v5

      - name: Wyślij stronę
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Opublikuj GameStats
        uses: actions/deploy-pages@v4
        
